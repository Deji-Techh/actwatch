[workspace]
resolver = "2"
members = [
    "crates/actwatch-core",
    "crates/actwatch-daemon",
    "crates/actwatch-cli",
    "crates/actwatch-tui",
    "crates/actwatch-gui",
]
default-members = ["crates/actwatch-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["actwatch contributors"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
