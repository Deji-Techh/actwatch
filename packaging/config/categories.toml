# actwatch configuration — installed to ~/.config/actwatch/categories.toml
#
# Everything here is optional. `actwatch-core` ships builtins for names,
# categories and titles, so this file only exists to override them:
#
#   [privacy] titles      what the daemon stores in app_events.title
#   [aliases]             app id -> friendly name shown by every frontend
#   [categories.<key>]    app id -> which of the six categories it belongs to
#
# App ids are the Hyprland `class` / window app id, matched case-insensitively.
# Unmatched apps fall back to a `.desktop` file name and then to the app id
# itself, and to the `other` category.

version = 2

# ---------------------------------------------------------------------------
# Window titles
# ---------------------------------------------------------------------------
# off  — nothing is stored (default, and the only privacy-safe choice)
# hash — a short non-reversible hash is stored instead of the text
# full — the title is stored verbatim
# No frontend renders titles either way; the CLI, TUI and GUI are app-level.
[privacy]
titles = "off"

# ---------------------------------------------------------------------------
# Friendly names
# ---------------------------------------------------------------------------
# Keys are app ids, values are what you want to read. These win over the
# `.desktop` `Name=` field, which wins over a prettified app id.
# Quote an app id that contains dots: an unquoted `a.b = "x"` is read by TOML
# as a nested table.
[aliases]
t3code = "T3 Code"
"org.gnome.Nautilus" = "Files"
"io.github.spacingbat3.webcord" = "WebCord"

# ---------------------------------------------------------------------------
# Categories
# ---------------------------------------------------------------------------
# The six categories are fixed: Social, Productivity & Finance, Utilities,
# Gaming, Media, Other. Add an app here to move it out of its builtin bucket.

[categories.social]
apps = ["discord", "fractal", "qutebrowser"]

[categories.productivity_finance]
apps = ["gnucash", "kmymoney", "zathura"]

[categories.utilities]
apps = ["nm-connection-editor", "pavucontrol", "wofi"]

[categories.gaming]
apps = ["bottles", "heroic", "lutris", "steam"]

[categories.media]
apps = ["celluloid", "haruna", "mpv", "obs", "spotify", "vlc"]

[categories.other]
# The fallback bucket. Listing apps here is only useful to pin something that
# would otherwise land in a different builtin category.
apps = ["caelestia-dash", "org.gnome.Idle"]